[project]
name = "autodistil-kg"
version = "0.1.0"
description = ""
authors = [
    {name = "Nimeshaperi",email = "nimesha.periyap@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "neo4j (>=6.1.0,<7.0.0)",
    "openai (>=2.16.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "anthropic (>=0.77.0,<0.78.0)",
    "requests (>=2.32.5,<3.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "deepeval (>=2.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
]

[project.optional-dependencies]
finetune = [
    "trl>=0.22.0",
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git",
    "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo.git",
    "transformers",
    "datasets",
]

[tool.poetry]
packages = [{include = "autodistil_kg", from = "src"}]

[tool.poetry.scripts]
autodistil-kg = "autodistil_kg.run:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "pytest (>=8.0.0)",
    "pytest-cov (>=5.0.0)",
    "ruff (>=0.4.0)",
    "mypy (>=1.10.0)",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
