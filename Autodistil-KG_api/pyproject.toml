[tool.poetry]
name = "kg-pipeline-api"
version = "0.1.0"
description = "FastAPI server and WebSocket API for Autodistil-KG pipelines"
readme = "README.md"
packages = [{include = "autodistilkg_api", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
redis = ">=5.0.0"
autodistil-kg = {path = "../Autodistil-KG_core", develop = true, extras = ["finetune"]}
autodistil-kg-graphrag = {path = "../Autodistil-KG_graphrag", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "*"
httpx = "*"
pytest-asyncio = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
