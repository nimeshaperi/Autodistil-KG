# Autodistil-KG — Full stack
#
# Starts all four services: Neo4j, Redis, API, and the web client.
#
# Prerequisites:
#   cp .env.example .env   # then fill in your LLM API key(s)
#
# First run (data import required):
#   docker compose up -d neo4j redis          # start infra first
#   bash scripts/setup-hetionet.sh            # import Hetionet (~5 min)
#   docker compose up --build -d api client   # build and start app services
#
# Subsequent runs:
#   docker compose up -d                      # (data already in neo4j_data volume)
#
# URLs once running:
#   Web UI      →  http://localhost:3000
#   API docs    →  http://localhost:8000/docs
#   Neo4j browser → http://localhost:7474

services:

  # ── Infrastructure ───────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: autodistil-kg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: autodistil-kg-neo4j
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      # Give Neo4j enough heap for the Hetionet dataset (2.25 M relationships)
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Application ──────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: Autodistil-KG_api/Dockerfile
      # Uncomment to include fine-tuning support (requires GPU + large image):
      # args:
      #   INSTALL_FINETUNE: "1"
    container_name: autodistil-kg-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Neo4j and Redis to use Docker service names (not localhost)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: neo4j
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      # Ollama running on the host machine (Docker Desktop / Linux host networking)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      KG_PIPELINE_WORKSPACE: /app/workspace
    volumes:
      - workspace:/app/workspace
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: Autodistil-KG_client
      dockerfile: Dockerfile
    container_name: autodistil-kg-client
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  neo4j_data:
  workspace:
